[project]
name = "update_toml"
version = "0.2.1"
description = "Update a TOML value from a CLI"
authors = [{name = "Jake Cyr", email = "cyrjake@gmail.com"}]
readme = "README.md"
license = "MIT"
keywords = ["toml", "requirements", "update"]
requires-python = ">=3.10,<4.0"
dependencies = ["tomlkit>=0.15.2,<0.16.0"]

[project.scripts]
update-toml = "update_toml.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
    "mypy>=2.4.1,<3",
    "coverage>=7.5,<8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
